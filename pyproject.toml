[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aaizaql"
version = "0.2.0"
description = "Natural Language to SQL — open-source library with RAG, self-correction, and federation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AaizaQL contributors" }]
keywords = ["sql", "nlp", "text-to-sql", "llm", "rag", "database", "natural-language"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Core dependencies ──────────────────────────────────────────────────────
# Every dep listed here is required for `pip install AAIZAQL` to work.
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlglot>=20.0",
  "structlog>=23.0",
  "requests>=2.28",
]

# ── Optional dependency groups ─────────────────────────────────────────────
[project.optional-dependencies]

# LLM providers (install the one(s) you use)
claude     = ["anthropic>=0.20"]
openai     = ["openai>=1.10"]
groq       = ["groq>=0.4"]
deepseek   = ["openai>=1.10"]           # DeepSeek uses the OpenAI-compatible SDK
perplexity = ["openai>=1.10"]           # Perplexity uses the OpenAI-compatible SDK
gemini     = ["google-genai>=1.0"]
mistral    = ["mistralai>=1.0"]

# RAG / local embeddings — ChromaDB vector store + sentence-transformers embedder
# Required for ingest_schema() and query() with the default ChromaDB backend.
# pip install aaizaql[rag]
rag = [
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
]

# Database connectors (install the one(s) you use)
postgres  = ["psycopg2-binary>=2.9"]
mysql     = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.0"]
duckdb    = ["duckdb>=0.10"]
mssql     = ["pyodbc>=4.0"]
oracle    = ["oracledb>=1.4"]
mongodb   = ["pymongo>=4.0"]
bigquery  = ["google-cloud-bigquery>=3.0", "db-dtypes>=1.0"]

# Visualization
charts = ["plotly>=5.0"]

# Vector store alternatives
qdrant = ["qdrant-client>=1.7"]

# Install everything (useful for development)
all = [
  "anthropic>=0.20",
  "openai>=1.10",
  "groq>=0.4",
  "google-genai>=1.0",
  "mistralai>=1.0",
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
  "psycopg2-binary>=2.9",
  "pymysql>=1.1",
  "duckdb>=0.10",
  "pyodbc>=4.0",
  "oracledb>=1.4",
  "pymongo>=4.0",
  "google-cloud-bigquery>=3.0",
  "db-dtypes>=1.0",
  "plotly>=5.0",
  "qdrant-client>=1.7",
]

# Development tools (NOT needed by library users)
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.5",
  "pre-commit>=3.5",
  # Include runtime deps for dev so tests work
  "anthropic>=0.20",
  "openai>=1.10",
  "groq>=0.4",
  "psycopg2-binary>=2.9",
  "duckdb>=0.10",
  "plotly>=5.0",
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
]

# ── Entry points ────────────────────────────────────────────────────────────
[project.scripts]
aaizaql = "aaizaql.cli:main"

# ── Project URLs ─────────────────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/ibrahimkhalil/aaizaql"
Documentation = "https://aaizaql.readthedocs.io"
"Bug Tracker" = "https://github.com/ibrahimkhalil/aaizaql/issues"

# ── Hatch build settings ────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/aaizaql"]

# ── Ruff linter ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # line length handled by formatter

# ── Black formatter ──────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
  "integration_pg: requires a live PostgreSQL instance (set POSTGRES_TEST_DSN)",
  "integration_mysql: requires a live MySQL instance (set MYSQL_TEST_DSN)",
  "integration_mssql: requires a live MSSQL instance (set MSSQL_TEST_DSN)",
  "integration_mongodb: requires a live MongoDB instance (set MONGODB_TEST_DSN)",
]

[tool.coverage.run]
source = ["src/aaizaql"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "src/aaizaql/cli.py",
  "src/aaizaql/security/audit.py",
  "src/aaizaql/federation/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 80% is enforced by the integration suite (all connectors exercised with
# live containers). The unit suite alone reaches ~66% because connector
# modules that require real databases (BigQuery, DuckDB, MongoDB, MSSQL,
# MySQL, Oracle, Postgres, Snowflake) cannot be covered without containers.
fail_under = 66