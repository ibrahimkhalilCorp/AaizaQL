[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqlix"
version = "0.1.0"
description = "Natural Language to SQL — federated, secure, context-aware"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "aqlix contributors" }]
keywords = ["sql", "nlp", "llm", "text-to-sql", "rag", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlglot>=23.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "chromadb>=0.4",
    "sentence-transformers>=2.7",
    "anthropic>=0.25",
    "openai>=1.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "duckdb>=0.10",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "snowflake-connector-python>=3.0",
    "structlog>=24.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "httpx>=0.27",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
aqlix = "aqlix.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/aqlix"
Documentation = "https://aqlix.readthedocs.io"
Repository = "https://github.com/your-org/aqlix"
Issues = "https://github.com/your-org/aqlix/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=aqlix --cov-report=term-missing --cov-report=xml -v"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/aqlix"]
omit = ["*/tests/*", "*/__init__.py"]
