[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aaizaql"
version = "0.2.3"
description = "Natural Language to SQL — open-source library with RAG, self-correction, and federation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AaizaQL contributors" }]
keywords = ["sql", "nlp", "text-to-sql", "llm", "rag", "database", "natural-language"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Core dependencies ──────────────────────────────────────────────────────
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlglot>=20.0",
  "structlog>=23.0",
  "requests>=2.28",
]

# ── Optional dependency groups ─────────────────────────────────────────────
[project.optional-dependencies]

claude     = ["anthropic>=0.20"]
openai     = ["openai>=1.10"]
groq       = ["groq>=0.4"]
deepseek   = ["openai>=1.10"]
perplexity = ["openai>=1.10"]
gemini     = ["google-genai>=1.0"]
mistral    = ["mistralai>=1.0"]

rag = [
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
]

postgres  = ["psycopg2-binary>=2.9"]
mysql     = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.0"]
duckdb    = ["duckdb>=0.10"]
mssql     = ["pyodbc>=4.0"]
oracle    = ["oracledb>=1.4"]
mongodb   = ["pymongo>=4.0"]
bigquery  = ["google-cloud-bigquery>=3.0", "db-dtypes>=1.0"]

charts = ["plotly>=5.0"]
qdrant = ["qdrant-client>=1.7"]

all = [
  "anthropic>=0.20",
  "openai>=1.10",
  "groq>=0.4",
  "google-genai>=1.0",
  "mistralai>=1.0",
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
  "psycopg2-binary>=2.9",
  "pymysql>=1.1",
  "duckdb>=0.10",
  "pyodbc>=4.0",
  "oracledb>=1.4",
  "pymongo>=4.0",
  "google-cloud-bigquery>=3.0",
  "db-dtypes>=1.0",
  "plotly>=5.0",
  "qdrant-client>=1.7",
]

dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.5",
  "pre-commit>=3.5",
  "anthropic>=0.20",
  "openai>=1.10",
  "groq>=0.4",
  "psycopg2-binary>=2.9",
  "duckdb>=0.10",
  "plotly>=5.0",
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
]

# ── Entry points ────────────────────────────────────────────────────────────
[project.scripts]
aaizaql = "aaizaql.cli:main"

# ── Project URLs ─────────────────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/ibrahimkhalil/aaizaql"
Documentation = "https://aaizaql.readthedocs.io"
"Bug Tracker" = "https://github.com/ibrahimkhalil/aaizaql/issues"

# ── Hatch build settings ────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/aaizaql"]

# ── Ruff linter ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Black formatter ──────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
  "integration_pg: requires a live PostgreSQL instance (set POSTGRES_TEST_DSN)",
  "integration_mysql: requires a live MySQL instance (set MYSQL_TEST_DSN)",
  "integration_mssql: requires a live MSSQL instance (set MSSQL_TEST_DSN)",
  "integration_mongodb: requires a live MongoDB instance (set MONGODB_TEST_DSN)",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
# T1.2 — Two thresholds enforced via separate coveragerc files:
#   .coveragerc-unit        → fail_under = 70  (unit suite, no containers)
#   .coveragerc-integration → fail_under = 82  (full suite, live containers)
#
# The [tool.coverage.*] sections below define shared defaults only.
# CI passes --cov-config= explicitly (see .github/workflows/ci.yml).

[tool.coverage.run]
source = ["src/aaizaql"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "src/aaizaql/cli.py",
  "src/aaizaql/security/audit.py",
  "src/aaizaql/federation/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# fail_under is NOT set here — it is set in .coveragerc-unit / .coveragerc-integration.
# Setting it here would silently override the per-suite configs.

[tool.coverage.html]
directory = "htmlcov"
title = "AAIZAQL Coverage Report"

[[tool.mypy.overrides]]
module = "tests.unit.test_llm_timeout"
ignore_errors = true
