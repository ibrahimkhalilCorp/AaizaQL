[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqlix"
version = "0.1.0"
description = "Natural Language to SQL — open-source library with RAG, self-correction, and federation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "aqlix contributors" }]
keywords = ["sql", "nlp", "text-to-sql", "llm", "rag", "database", "natural-language"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Core dependencies ──────────────────────────────────────────────────────
# Every dep listed here is required for `pip install aqlix` to work.
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlglot>=20.0",
  "structlog>=23.0",
  "requests>=2.28",
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
]

# ── Optional dependency groups ─────────────────────────────────────────────
[project.optional-dependencies]

# LLM providers (install the one(s) you use)
claude  = ["anthropic>=0.20"]
openai  = ["openai>=1.10"]
groq    = ["groq>=0.4"]

# Database connectors (install the one(s) you use)
postgres  = ["psycopg2-binary>=2.9"]
mysql     = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.0"]
duckdb    = ["duckdb>=0.10"]

# Visualization
charts = ["plotly>=5.0"]

# Vector store alternatives
qdrant = ["qdrant-client>=1.7"]

# Install everything (useful for development)
all = [
  "anthropic>=0.20",
  "openai>=1.10",
  "groq>=0.4",
  "psycopg2-binary>=2.9",
  "pymysql>=1.1",
  "duckdb>=0.10",
  "plotly>=5.0",
  "qdrant-client>=1.7",
]

# Development tools (NOT needed by library users)
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.5",
  "pre-commit>=3.5",
  # Include runtime deps for dev so tests work
  "anthropic>=0.20",
  "openai>=1.10",
  "groq>=0.4",
  "psycopg2-binary>=2.9",
  "duckdb>=0.10",
  "plotly>=5.0",
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
]

# ── Entry points ────────────────────────────────────────────────────────────
[project.scripts]
aqlix = "aqlix.cli:main"

# ── Project URLs ─────────────────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/your-org/aqlix"
Documentation = "https://aqlix.readthedocs.io"
"Bug Tracker" = "https://github.com/your-org/aqlix/issues"

# ── Hatch build settings ────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/aqlix"]

# ── Ruff linter ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # line length handled by formatter

# ── Black formatter ──────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/aqlix"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
