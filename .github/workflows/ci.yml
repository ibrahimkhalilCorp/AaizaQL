# T5.6 — aaizaql CI/CD quality gate
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[rag,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src/aaizaql/

      - name: Unit tests
        run: pytest tests/unit/ -x -q

      - name: Integration tests
        run: pytest tests/integration/ -x -q --timeout=60
