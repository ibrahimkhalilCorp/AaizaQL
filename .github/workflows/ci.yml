# aaizaql — CI quality gate
# Runs on every push and pull_request to main.
# Blocks merge if lint, type-check, or tests fail.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality Gate · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,duckdb,mysql,postgres]" --quiet

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/aaizaql/

      - name: Validate test imports (T1.1)
        run: python scripts/check_test_imports.py

      - name: Unit tests
        run: pytest tests/unit/ -x -q

      - name: Integration tests (SQLite + DuckDB only — no containers)
        run: |
          pytest tests/integration/ \
            -k "SQLite or DuckDB" \
            -x -q --timeout=60
