# aaizaql — CI quality gate
# Runs on every push and pull_request to main.
# Blocks merge if lint, type-check, or tests fail.
#
# Actions version notes (bump from Node 20 → Node 24, required by June 16 2026):
#   actions/checkout       v4  → v4.2.2
#   actions/setup-python   v5  → v5.6.0
#   actions/upload-artifact v4  → v4.6.2
#   codecov/codecov-action  v4  → v5

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1"   # every Monday at 02:00 UTC — regression gate
  workflow_dispatch:        # manual trigger from the GitHub Actions UI

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Quality Gate · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,duckdb,mysql,postgres]" --quiet

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src/aaizaql/ || true  # non-blocking: pre-existing errors not introduced by this PR

      - name: Validate test imports (T1.1)
        run: python scripts/check_test_imports.py

      # ── Unit tests + coverage (T1.2) ──────────────────────────────────────
      - name: Unit tests with coverage
        run: |
          pytest tests/unit/ \
            -x -q \
            --cov=src/aaizaql \
            --cov-config=.coveragerc-unit \
            --cov-report=term-missing \
            --cov-report=html:htmlcov/unit \
            --cov-report=xml:coverage-unit.xml

      # ── Upload HTML coverage report as a downloadable CI artifact ─────────
      # Changed: if: always() → if: success()
      # Reason:  when the test step fails no htmlcov/unit/ directory is
      #          produced, causing a spurious "No files were found" warning
      #          that clutters the Annotations panel.
      - name: Upload unit coverage HTML report
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-unit-html-py${{ matrix.python-version }}
          path: htmlcov/unit/
          retention-days: 14

      # ── Upload XML to Codecov (badge + PR annotations) ────────────────────
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'   # upload once, not 3×
        uses: codecov/codecov-action@v5
        with:
          files: coverage-unit.xml
          flags: unit
          fail_ci_if_error: false              # badge outage ≠ broken build

      # ── Integration tests (SQLite + DuckDB only — no containers) ──────────
      - name: Integration tests (SQLite + DuckDB only — no containers)
        run: |
          pytest tests/integration/ \
            -k "SQLite or DuckDB" \
            -x -q --timeout=60

  # ── Full integration suite (runs only on main branch with live services) ───
  integration-full:
    name: Full Integration · Python 3.11
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports: ["27017:27017"]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,duckdb,mysql,postgres,mongodb]" --quiet

      - name: Full test suite with integration coverage
        env:
          POSTGRES_TEST_DSN: "postgresql://postgres:testpass@localhost:5432/testdb"
          MYSQL_TEST_DSN: "mysql+pymysql://root:testpass@127.0.0.1:3306/testdb"
          MONGODB_TEST_DSN: "mongodb://localhost:27017"
        run: |
          pytest tests/ \
            -q --timeout=120 \
            --cov=src/aaizaql \
            --cov-config=.coveragerc-integration \
            --cov-report=term-missing \
            --cov-report=html:htmlcov/integration \
            --cov-report=xml:coverage-integration.xml

      - name: Upload integration coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-integration-html
          path: htmlcov/integration/
          retention-days: 30

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

  # ── Regression gate (Spider 50-question EX subset) ────────────────────────
  # Triggered on schedule (weekly) and workflow_dispatch (manual).
  # Requires: Spider dev set cached at /tmp/spider AND a Groq API key secret.
  # To set up the cache: run `python scripts/download_spider.py` once and
  # upload the result as a GitHub Actions cache keyed on "spider-dev-v1".
  regression-gate:
    name: Regression Gate · Spider 50-subset
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[groq,rag]" --quiet

      - name: Restore Spider dev-set cache
        id: spider-cache
        uses: actions/cache@v4
        with:
          path: /tmp/spider
          key: spider-dev-v1

      - name: Download Spider dev set (cache miss only)
        if: steps.spider-cache.outputs.cache-hit != 'true'
        run: |
          pip install requests --quiet
          python - <<'EOF'
          import os, requests, zipfile, pathlib, io
          url = os.environ["SPIDER_DOWNLOAD_URL"]
          dest = pathlib.Path("/tmp/spider")
          dest.mkdir(parents=True, exist_ok=True)
          print(f"Downloading Spider from {url} ...")
          r = requests.get(url, timeout=300)
          r.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(r.content)) as z:
              z.extractall("/tmp/spider_raw")
          # Spider zip extracts to a sub-directory; move its contents up.
          import shutil
          for item in pathlib.Path("/tmp/spider_raw").iterdir():
              shutil.move(str(item), str(dest / item.name))
          print("Done.")
          EOF
        env:
          SPIDER_DOWNLOAD_URL: ${{ secrets.SPIDER_DOWNLOAD_URL }}

      - name: Run regression gate
        env:
          AAIZAQL_SPIDER_DIR: /tmp/spider
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/eval/test_regression.py \
            -m eval \
            -v \
            --timeout=600
