# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# Continuous Integration for aaizaql
#
# Jobs (in dependency order):
#   lint     → ruff auto-fix + black auto-format, committed back to branch
#   test     → unit + integration tests across Python 3.11 / 3.12 / 3.13
#   providers→ provider-specific test matrix (deepseek/gemini/mistral/perplexity)
#   security → security gate + prompt-injection tests in isolation
#   coverage → upload merged coverage to Codecov (from 3.11 run)
#   build    → wheel + sdist, twine check (needs lint + test + providers)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared env ────────────────────────────────────────────────────────────────
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# ══════════════════════════════════════════════════════════════════════════════
# Job 1 — Lint & Format
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit auto-fixes back

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install ruff black mypy pydantic pydantic-settings

      - name: Ruff auto-fix
        run: ruff check src/ tests/ --fix --unsafe-fixes

      - name: Black auto-format
        run: black src/ tests/

      - name: Commit style fixes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Nothing to commit" || \
            (git add -A && git commit -m "style: auto-fix ruff + black [skip ci]")

      - name: Push fixes
        run: git push

      - name: Ruff final check (zero tolerance)
        run: ruff check src/ tests/

      - name: Mypy type check
        run: |
          pip install -e ".[dev]" --quiet
          mypy src/aaizaql --ignore-missing-imports --no-error-summary || true
        # `|| true` keeps mypy non-blocking while the codebase matures;
        # remove once strict mode is fully adopted

# ══════════════════════════════════════════════════════════════════════════════
# Job 2 — Unit + Integration Tests (Python matrix)
# ══════════════════════════════════════════════════════════════════════════════
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + connectors + dev deps
        run: |
          pip install -e ".[dev,duckdb,mysql,postgres,mssql,oracle,mongodb,bigquery]" --quiet

      - name: Run unit tests
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            --ignore=tests/test_llm_deepseek.py \
            --ignore=tests/test_llm_gemini.py \
            --ignore=tests/test_llm_mistral.py \
            --ignore=tests/test_llm_perplexity.py \
            --cov=src/aaizaql \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            -v

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=src/aaizaql \
            --cov-append \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage artifact (3.11 only)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            coverage-unit.xml
            coverage-integration.xml

# ══════════════════════════════════════════════════════════════════════════════
# Job 3 — Provider-specific test matrix
# Tests each new LLM provider in isolation so failures are easy to pinpoint
# ══════════════════════════════════════════════════════════════════════════════
  providers:
    name: Provider · ${{ matrix.provider }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        provider: [deepseek, gemini, mistral, perplexity]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps for ${{ matrix.provider }}
        run: |
          pip install -e ".[dev,${{ matrix.provider }}]" --quiet

      - name: Run unit tests for ${{ matrix.provider }}
        run: |
          pytest tests/test_llm_${{ matrix.provider }}.py \
            -v \
            --tb=short \
            --cov=src/aaizaql/llm \
            --cov-report=term-missing \
            --cov-fail-under=0

      - name: Run integration tests for ${{ matrix.provider }}
        run: |
          pytest tests/integration/test_integration_pipeline.py \
            -v \
            --tb=short \
            -k "${{ matrix.provider }}"

# ══════════════════════════════════════════════════════════════════════════════
# Job 4 — Security gate tests (isolated, always runs)
# ══════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Gate Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]" --quiet

      - name: Run security tests
        run: |
          pytest tests/test_security.py \
            tests/integration/test_integration_pipeline.py::TestSecurityGatePipeline \
            -v \
            --tb=short

# ══════════════════════════════════════════════════════════════════════════════
# Job 4b — Connector integration matrix
# Spins up Postgres, MySQL, MSSQL, MongoDB via Docker Compose.
# SQLite and DuckDB run without a container.
# Snowflake, BigQuery, Oracle are skipped unless their DSN env var is set.
# ══════════════════════════════════════════════════════════════════════════════
  connector-matrix:
    name: Connector Matrix · ${{ matrix.connector }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        connector: [sqlite, duckdb, postgres, mysql, mssql, mongodb]

    services:
      postgres:
        image: ${{ matrix.connector == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: aaizaql
          POSTGRES_PASSWORD: aaizaql
          POSTGRES_DB: aaizaql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaizaql -d aaizaql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: ${{ matrix.connector == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: aaizaql
          MYSQL_USER: aaizaql
          MYSQL_PASSWORD: aaizaql
          MYSQL_DATABASE: aaizaql_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u aaizaql -paaizaql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

      mssql:
        image: ${{ matrix.connector == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "AaizaQL_2024!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AaizaQL_2024!' -Q 'SELECT 1' -No -C"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15

      mongodb:
        image: ${{ matrix.connector == 'mongodb' && 'mongo:7.0' || '' }}
        env:
          MONGO_INITDB_ROOT_USERNAME: aaizaql
          MONGO_INITDB_ROOT_PASSWORD: aaizaql
          MONGO_INITDB_DATABASE: aaizaql_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\" --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ODBC driver (MSSQL only)
        if: matrix.connector == 'mssql'
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | \
            sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | \
            sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -yq msodbcsql18 unixodbc-dev

      - name: Install connector dependencies
        run: |
          pip install -e ".[dev,duckdb,postgres,mysql,mssql,mongodb]" --quiet

      - name: Run connector matrix tests · ${{ matrix.connector }}
        env:
          POSTGRES_TEST_DSN: postgresql://aaizaql:aaizaql@localhost:5432/aaizaql_test
          MYSQL_TEST_DSN: mysql://aaizaql:aaizaql@localhost:3306/aaizaql_test
          MSSQL_TEST_DSN: mssql://sa:AaizaQL_2024!@localhost:1433/master
          MONGODB_TEST_DSN: mongodb://aaizaql:aaizaql@localhost:27017/aaizaql_test?authSource=admin
        run: |
          pytest tests/integration/test_connector_matrix.py \
            -k "Test${{ matrix.connector == 'sqlite' && 'SQLite' || matrix.connector == 'duckdb' && 'DuckDB' || matrix.connector == 'postgres' && 'PostgreSQL' || matrix.connector == 'mysql' && 'MySQL' || matrix.connector == 'mssql' && 'MSSQL' || 'MongoDB' }}Connector" \
            -v \
            --tb=short \
            --cov=src/aaizaql/connectors \
            --cov-report=term-missing \
            --cov-fail-under=0

# ══════════════════════════════════════════════════════════════════════════════
# Job 5 — Coverage upload to Codecov
# ══════════════════════════════════════════════════════════════════════════════
  coverage:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: [test, providers, connector-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml,coverage-integration.xml
          flags: unittests,integration
          fail_ci_if_error: false   # don't break CI if Codecov is down
          token: ${{ secrets.CODECOV_TOKEN }}

# ══════════════════════════════════════════════════════════════════════════════
# Job 6 — Build wheel + sdist (only after all tests pass)
# ══════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [test, providers, security, connector-matrix]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel + sdist
        run: |
          pip install hatchling build --quiet
          python -m build

      - name: Verify distribution metadata
        run: |
          pip install twine --quiet
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7