# aaizaql — Publish to PyPI
# ─────────────────────────────────────────────────────────────────────────────
# Triggered by pushing a version tag (e.g. v0.2.1).
#
# Flow:
#   1. Tag push  →  full CI gate (lint + tests, Python 3.11/3.12/3.13)
#   2. CI passes →  build wheel + sdist, verify with twine
#   3. Build OK  →  publish to PyPI via OIDC Trusted Publishing (no token needed)
#   4. Published →  create GitHub Release with changelog + dist artifacts
#
# One-time PyPI setup (do this once):
#   https://pypi.org/manage/project/aaizaql/settings/publishing/
#   → Add Trusted Publisher:
#       Owner:      ibrahimkhalilCorp
#       Repo:       AaizaQL
#       Workflow:   publish.yml
#       Environment: pypi
# ─────────────────────────────────────────────────────────────────────────────

name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"           # v0.2.1
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+" # v0.2.1.post1

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# ══════════════════════════════════════════════════════════════════════════════
# Job 1 — Full CI gate (must pass before anything publishes)
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  ci-gate:
    name: CI Gate · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,duckdb,mysql,postgres]" --quiet

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/aaizaql/

      - name: Unit tests
        run: pytest tests/unit/ -x -q

      - name: Integration tests (SQLite + DuckDB only — no containers)
        run: |
          pytest tests/integration/ \
            -k "SQLite or DuckDB" \
            -x -q --timeout=60

# ══════════════════════════════════════════════════════════════════════════════
# Job 2 — Build wheel + sdist from the tagged commit
# ══════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: ci-gate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel + sdist
        run: |
          pip install hatchling build twine --quiet
          python -m build

      - name: Verify metadata (twine check)
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 30

# ══════════════════════════════════════════════════════════════════════════════
# Job 3 — Publish to PyPI via OIDC Trusted Publishing
# ══════════════════════════════════════════════════════════════════════════════
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/aaizaql/

    permissions:
      id-token: write   # required for OIDC Trusted Publishing
      contents: read

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

# ══════════════════════════════════════════════════════════════════════════════
# Job 4 — Create GitHub Release with changelog + dist artifacts
# ══════════════════════════════════════════════════════════════════════════════
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SECTION=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            SECTION="See CHANGELOG.md for full details."
          fi
          echo "text<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SECTION"  >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "aaizaql ${{ github.ref_name }}"
          body: |
            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.text }}

            ---

            ### Install

            ```bash
            pip install aaizaql==${{ steps.version.outputs.version }}

            # With LLM provider
            pip install "aaizaql[groq]==${{ steps.version.outputs.version }}"
            pip install "aaizaql[claude]==${{ steps.version.outputs.version }}"

            # With database connector
            pip install "aaizaql[postgres]==${{ steps.version.outputs.version }}"
            pip install "aaizaql[mysql]==${{ steps.version.outputs.version }}"
            ```

            PyPI: https://pypi.org/project/aaizaql/${{ steps.version.outputs.version }}/
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
