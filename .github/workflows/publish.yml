# .github/workflows/publish.yml
# ─────────────────────────────────────────────────────────────────────────────
# Publishes aaizaql to PyPI on every version tag (v*.*.*).
#
# Flow:
#   1. Triggered by pushing a tag like `v0.2.1`
#   2. Runs the full CI suite (lint → test → providers → security)
#   3. Builds the distribution
#   4. Publishes to PyPI using Trusted Publishing (no token stored in secrets)
#   5. Creates a GitHub Release with the built artifacts attached
#
# Setup required (one-time):
#   - Go to https://pypi.org/manage/project/aaizaql/settings/publishing/
#   - Add a "Trusted Publisher" for this repo / workflow
#   - No PYPI_API_TOKEN secret needed — OIDC handles auth automatically
# ─────────────────────────────────────────────────────────────────────────────

name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"          # e.g. v0.2.1
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+" # e.g. v0.2.1.post1

# Only one publish can run at a time
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
# ══════════════════════════════════════════════════════════════════════════════
# Job 1 — Full CI gate (must pass before anything is published)
# ══════════════════════════════════════════════════════════════════════════════
  ci-gate:
    name: CI Gate · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true          # abort immediately if any version fails
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install all provider + connector deps
        run: |
          pip install -e ".[dev,deepseek,gemini,mistral,perplexity,duckdb,mysql,postgres]" --quiet

      - name: Lint
        run: |
          ruff check src/ tests/
          black --check src/ tests/

      - name: Unit tests
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            -v --tb=short

      - name: Integration tests
        run: |
          pytest tests/integration/ \
            -v --tb=short

      - name: Provider tests (all four)
        run: |
          pytest \
            tests/test_llm_deepseek.py \
            tests/test_llm_gemini.py \
            tests/test_llm_mistral.py \
            tests/test_llm_perplexity.py \
            -v --tb=short

      - name: Security gate tests
        run: |
          pytest tests/test_security.py \
            tests/integration/test_integration_pipeline.py::TestSecurityGatePipeline \
            -v --tb=short

# ══════════════════════════════════════════════════════════════════════════════
# Job 2 — Build distribution
# ══════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: ci-gate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel + sdist
        run: |
          pip install hatchling build twine --quiet
          python -m build

      - name: Verify metadata
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 30

# ══════════════════════════════════════════════════════════════════════════════
# Job 3 — Publish to PyPI via OIDC Trusted Publishing
# ══════════════════════════════════════════════════════════════════════════════
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/aaizaql/

    # OIDC requires these two permissions
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No api_token needed — Trusted Publishing handles authentication

# ══════════════════════════════════════════════════════════════════════════════
# Job 4 — Create GitHub Release with changelog + artifacts
# ══════════════════════════════════════════════════════════════════════════════
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi

    permissions:
      contents: write          # needed to create releases and upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so we can generate a changelog

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build changelog since last tag
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^$GITHUB_REF_NAME$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          CHANGELOG=$(git log "$RANGE" \
            --pretty=format:"- %s (%h)" \
            --no-merges \
            | head -40)
          # Escape for GitHub Actions multiline output
          echo "text<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG"  >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "aaizaql ${{ github.ref_name }}"
          body: |
            ## What's changed in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.text }}

            ---

            ### Installation

            ```bash
            pip install aaizaql==${{ steps.version.outputs.version }}

            # With provider extras
            pip install "aaizaql[deepseek]==${{ steps.version.outputs.version }}"
            pip install "aaizaql[gemini]==${{ steps.version.outputs.version }}"
            pip install "aaizaql[mistral]==${{ steps.version.outputs.version }}"
            pip install "aaizaql[perplexity]==${{ steps.version.outputs.version }}"
            ```

            ### Full PyPI page
            https://pypi.org/project/aaizaql/${{ steps.version.outputs.version }}/
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}