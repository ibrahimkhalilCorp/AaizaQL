version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aaizaql
      POSTGRES_PASSWORD: aaizaql
      POSTGRES_DB: aaizaql_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaizaql -d aaizaql_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: aaizaql
      MYSQL_USER: aaizaql
      MYSQL_PASSWORD: aaizaql
      MYSQL_DATABASE: aaizaql_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "aaizaql", "-paaizaql"]
      interval: 5s
      timeout: 5s
      retries: 15

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "AaizaQL_2024!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AaizaQL_2024!' -Q 'SELECT 1' -No -C || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: aaizaql
      MONGO_INITDB_ROOT_PASSWORD: aaizaql
      MONGO_INITDB_DATABASE: aaizaql_test
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10