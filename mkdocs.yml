site_name: aqlix
site_description: Natural Language to SQL — open-source Python library with RAG, self-correction, and federation
site_url: https://aqlix.readthedocs.io
repo_url: https://github.com/ibrahimkhalil/aqlix
repo_name: ibrahimkhalil/aqlix
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Databases: guide/databases.md
    - LLM Providers: guide/llm-providers.md
    - Training & Memory: guide/training.md
    - SQL Security: guide/security.md
    - CLI Reference: guide/cli.md
  - API Reference:
    - QueryEngine: api/engine.md
    - Connectors: api/connectors.md
    - LLM Providers: api/llm.md
  - Contributing: contributing.md